<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Game Details | Mosayad Games</title>

    <meta name="theme-color" content="#111648">

    <link rel="icon" href="images/logo.png">

    <link rel="stylesheet" href="css/game.css">

</head>

<body>

    <!--========== HEADER ==========-->

    <header>

        <a href="index.html" class="back-btn">
            ← Home
        </a>

        <div class="logo">

            <img src="images/logo.png" alt="Logo">

            <h1>Mosayad Games</h1>

        </div>

    </header>

    <!--========== GAME ==========-->

    <main>

        <div class="game-container">

            <img
                id="game-image"
                src=""
                alt="Game Image"
            >

            <div class="game-info">

                <h1 id="game-name">
                    Loading...
                </h1>

                <p id="game-description"></p>

                <div class="info-grid">

                    <div class="info-card">
                        <h3>Version</h3>
                        <p id="game-version"></p>
                    </div>

                    <div class="info-card">
                        <h3>Size</h3>
                        <p id="game-size"></p>
                    </div>

                    <div class="info-card">
                        <h3>Platform</h3>
                        <p id="game-platform"></p>
                    </div>

                    <div class="info-card">
                        <h3>Release Date</h3>
                        <p id="game-release"></p>
                    </div>

                    <div class="info-card">
                        <h3>Downloads</h3>
                        <p id="game-downloads"></p>
                    </div>

                    <div class="info-card">
                        <h3>Likes</h3>
                        <p id="game-likes"></p>
                    </div>

                </div>

                <div class="steps-box">

                    <h2>
                        How to run
                    </h2>

                    <p id="game-steps"></p>

                </div>

                <div class="buttons">

                    <button
                        id="like-btn"
                        class="like-btn">

                        👍🏻 Like

                    </button>

                    <a
                        id="download-btn"
                        class="download-btn"
                        download>

                        ⬇ Download

                    </a>

                </div>

            </div>

        </div>

    </main>

    <!--========== FOOTER ==========-->

    <footer>

        © 2026 Mosayad Games

    </footer>

    <!--========== SOUNDS ==========-->

    <audio id="click-sound" preload="auto">

        <source src="sounds/click.mp3" type="audio/mpeg">

    </audio>

    <audio id="hover-sound" preload="auto">

        <source src="sounds/hover.mp3" type="audio/mpeg">

    </audio>

    <script type="module" src="js/game.js"></script>

</body>

</html>
